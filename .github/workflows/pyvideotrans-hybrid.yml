name: pyVideoTrans Hybrid STT

on:
  workflow_dispatch:
    inputs:
      whisper_model:
        description: Faster-whisper model to run on Kaggle
        required: false
        default: large-v3
      kaggle_accelerator:
        description: Kaggle GPU accelerator identifier
        required: false
        default: NvidiaTeslaT4
      monitor_timeout_minutes:
        description: Maximum time to wait for the Kaggle kernel
        required: false
        default: "120"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  hybrid-stt:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      INPUT_DIR: ${{ github.workspace }}/input
      FINAL_DIR: ${{ github.workspace }}/final
      DATASET_DIR: ${{ github.workspace }}/.kaggle-staging/dataset
      KERNEL_DIR: ${{ github.workspace }}/.kaggle-staging/kernel
      KAGGLE_OUTPUT_DIR: ${{ github.workspace }}/.kaggle-staging/output
      INPUT_VIDEO_PATH: ${{ github.workspace }}/input/input.mp4
      FINAL_VIDEO_PATH: ${{ github.workspace }}/final/final.mp4
      RCLONE_CONFIG_PATH: ${{ github.workspace }}/.rclone/pyvideotrans.conf
      WHISPER_MODEL: ${{ inputs.whisper_model }}
      KAGGLE_ACCELERATOR: ${{ inputs.kaggle_accelerator }}
      MONITOR_TIMEOUT_MINUTES: ${{ inputs.monitor_timeout_minutes }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}

    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          RCLONE_MEGA_CONFIG: ${{ secrets.RCLONE_MEGA_CONFIG }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_USERNAME:-}" ]] || { echo "Missing required secret: KAGGLE_USERNAME"; exit 1; }
          [[ -n "${KAGGLE_API_TOKEN:-}" ]] || { echo "Missing required secret: KAGGLE_API_TOKEN"; exit 1; }
          [[ -n "${RCLONE_MEGA_CONFIG:-}" ]] || { echo "Missing required secret: RCLONE_MEGA_CONFIG"; exit 1; }

      - name: Show runner capacity
        shell: bash
        run: |
          set -euo pipefail
          echo "CPU count: $(nproc)"
          free -h
          df -h

      - name: Install CLI utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg jq
          curl --fail --silent --show-error --location https://rclone.org/install.sh | sudo bash
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade kaggle
          kaggle --version
          rclone version

      - name: Authenticate Kaggle CLI
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kaggle datasets list --page-size 1 >/dev/null

      - name: Authenticate MEGA storage
        shell: bash
        env:
          RCLONE_MEGA_CONFIG: ${{ secrets.RCLONE_MEGA_CONFIG }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$(dirname "${RCLONE_CONFIG_PATH}")"
          config_tmp="${RCLONE_CONFIG_PATH}.tmp"
          auth_log="${RUNNER_TEMP}/rclone-auth.log"

          print_redacted_rclone_error() {
            python3 - "${auth_log}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          sensitive = re.compile(
              r"(?i)(\b(?:session[_-]?id|master[_-]?key|password|pass|token|"
              r"access[_-]?token|refresh[_-]?token|client[_-]?secret|secret)\b\s*[=:]\s*)"
              r"(?:\"[^\"]*\"|'[^']*'|\S+)"
          )
          redacted = sensitive.sub(r"\1<redacted>", text)
          print(redacted.rstrip() or "<no rclone stderr captured>")
          PY
          }

          if ! printf '%s' "${RCLONE_MEGA_CONFIG}" | tr -d '[:space:]' | base64 --decode >"${config_tmp}"; then
            rm -f "${config_tmp}" "${RCLONE_CONFIG_PATH}" "${auth_log}"
            echo "RCLONE_MEGA_CONFIG is not valid Base64."
            exit 1
          fi
          if [[ ! -s "${config_tmp}" ]]; then
            rm -f "${config_tmp}" "${RCLONE_CONFIG_PATH}" "${auth_log}"
            echo "Decoded RCLONE_MEGA_CONFIG is empty."
            exit 1
          fi
          chmod 600 "${config_tmp}"
          mv -f "${config_tmp}" "${RCLONE_CONFIG_PATH}"
          config_size="$(stat -c '%s' "${RCLONE_CONFIG_PATH}")"
          config_mode="$(stat -c '%a' "${RCLONE_CONFIG_PATH}")"
          if [[ "${config_size}" -le 0 || "${config_mode}" != "600" ]]; then
            rm -f "${RCLONE_CONFIG_PATH}" "${config_tmp}" "${auth_log}"
            echo "Decoded rclone config failed file safety checks."
            exit 1
          fi
          remote_names="${RUNNER_TEMP}/rclone-remotes.txt"
          if ! rclone --config "${RCLONE_CONFIG_PATH}" listremotes >"${remote_names}" 2>"${auth_log}"; then
            echo "rclone could not parse the decoded config (config_bytes=${config_size}, mode=${config_mode})."
            print_redacted_rclone_error
            rm -f "${remote_names}" "${auth_log}" "${RCLONE_CONFIG_PATH}" "${config_tmp}"
            exit 1
          fi
          if ! grep -Fxq "megadrive:" "${remote_names}"; then
            echo "Decoded rclone config does not define the required megadrive remote."
            print_redacted_rclone_error
            rm -f "${remote_names}" "${auth_log}" "${RCLONE_CONFIG_PATH}" "${config_tmp}"
            exit 1
          fi
          if rclone --config "${RCLONE_CONFIG_PATH}" lsf --files-only "megadrive:pyvideotrans" > /dev/null 2>"${auth_log}"; then
            :
          else
            status=$?
            echo "MEGA input-folder check failed (rclone exit ${status}; config_bytes=${config_size}, mode=${config_mode})."
            print_redacted_rclone_error
            rm -f "${remote_names}" "${auth_log}" "${RCLONE_CONFIG_PATH}" "${config_tmp}"
            exit "${status}"
          fi
          rm -f "${remote_names}" "${auth_log}"
          echo "MEGA authentication verified: remote=megadrive, input=megadrive:pyvideotrans, config_bytes=${config_size}, mode=${config_mode}"

      - name: Discover MEGA input
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${INPUT_DIR}" "${FINAL_DIR}" "${GITHUB_WORKSPACE}/.kaggle-staging"
          mkdir -p "${INPUT_DIR}" "${FINAL_DIR}" "${DATASET_DIR}" "${KERNEL_DIR}" "${KAGGLE_OUTPUT_DIR}"
          listing="${RUNNER_TEMP}/mega-input.json"
          if ! rclone --config "${RCLONE_CONFIG_PATH}" lsjson --files-only \
            --exclude '.DS_Store' --exclude '._.DS_Store' \
            "megadrive:pyvideotrans" >"${listing}" 2>/dev/null; then
            rm -f "${listing}"
            echo "Unable to list MEGA input folder megadrive:pyvideotrans."
            exit 1
          fi
          selection="$(python3 - "${listing}" <<'PY'
          import json
          import sys
          from pathlib import Path

          supported = (".mp4", ".mov", ".mkv", ".webm", ".m4v")
          entries = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          videos = [
              item for item in entries
              if str(item.get("Name", "")).lower().endswith(supported)
          ]
          if not videos:
              raise SystemExit("No supported video found in megadrive:pyvideotrans")
          if len(videos) > 1:
              print("More than one supported video found in megadrive:pyvideotrans:", file=sys.stderr)
              for item in videos:
                  print(f" - {item.get('Name', '')}", file=sys.stderr)
              raise SystemExit(1)
          name = str(videos[0].get("Name", ""))
          if not name or any(not char.isprintable() for char in name) or Path(name).name != name:
              raise SystemExit("MEGA input filename contains unsupported path characters")
          print(f"{name}\t{int(videos[0].get('Size', 0))}")
          PY
          )"
          rm -f "${listing}"
          IFS=$'\t' read -r MEGA_SOURCE_NAME MEGA_SOURCE_SIZE <<<"${selection}"
          safe_name="$(python3 - "${MEGA_SOURCE_NAME}" <<'PY'
          import re
          import sys
          from pathlib import Path

          name = Path(sys.argv[1]).name
          safe = re.sub(r"[^A-Za-z0-9._-]+", "_", name).strip("._")
          if not safe:
              raise SystemExit("MEGA input filename cannot be safely represented")
          print(safe)
          PY
          )"
          stem="$(python3 - "${safe_name}" <<'PY'
          import re
          import sys
          from pathlib import Path

          stem = re.sub(r"[^A-Za-z0-9._-]+", "_", Path(sys.argv[1]).stem).strip("._")
          if not stem:
              raise SystemExit("MEGA input filename has no usable stem")
          print(stem)
          PY
          )"
          candidate="${stem}-subtitled.mp4"
          candidate_listing="${RUNNER_TEMP}/rclone-candidate-list.txt"
          remote_file_exists() {
            local remote_path="$1"
            if rclone --config "${RCLONE_CONFIG_PATH}" lsf --files-only --format p "${remote_path}" >"${candidate_listing}" 2>/dev/null; then
              return 0
            else
              local status=$?
            fi
            case "${status}" in
              3|4) return 1 ;;
              *) echo "Unable to check MEGA output path safely (rclone exit ${status})."; exit "${status}" ;;
            esac
          }
          if remote_file_exists "megadrive:video-out/${candidate}"; then
            candidate="${stem}-subtitled-${GITHUB_RUN_ID}.mp4"
            attempt=1
            while remote_file_exists "megadrive:video-out/${candidate}"; do
              candidate="${stem}-subtitled-${GITHUB_RUN_ID}-${attempt}.mp4"
              attempt=$((attempt + 1))
            done
          fi
          rm -f "${candidate_listing}"
          INPUT_VIDEO_PATH="${INPUT_DIR}/${safe_name}"
          echo "MEGA_SOURCE_NAME=${MEGA_SOURCE_NAME}" >> "${GITHUB_ENV}"
          echo "MEGA_OUTPUT_NAME=${candidate}" >> "${GITHUB_ENV}"
          echo "INPUT_VIDEO_PATH=${INPUT_VIDEO_PATH}" >> "${GITHUB_ENV}"
          echo "FINAL_VIDEO_PATH=${FINAL_DIR}/${candidate}" >> "${GITHUB_ENV}"
          echo "MEGA input: ${MEGA_SOURCE_NAME} (${MEGA_SOURCE_SIZE} bytes)"
          echo "MEGA output: ${candidate}"

      - name: Download MEGA input
        shell: bash
        run: |
          set -euo pipefail
          if ! rclone --config "${RCLONE_CONFIG_PATH}" copyto "megadrive:pyvideotrans/${MEGA_SOURCE_NAME}" "${INPUT_VIDEO_PATH}" --no-traverse >"${RUNNER_TEMP}/rclone-download.log" 2>&1; then
            rm -f "${RUNNER_TEMP}/rclone-download.log"
            echo "Failed to download ${MEGA_SOURCE_NAME} from MEGA."
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/rclone-download.log"

      - name: Validate input media
        shell: bash
        run: |
          set -euo pipefail
          [[ -s "${INPUT_VIDEO_PATH}" ]] || { echo "Downloaded MEGA input is empty"; exit 1; }
          python3 - "${INPUT_VIDEO_PATH}" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          with path.open("rb") as stream:
              prefix = stream.read(8192).lstrip().lower()
          html_markers = (b"<html", b"<!doctype html", b"<head", b"<body")
          if any(prefix.startswith(marker) for marker in html_markers) or b"<html" in prefix:
              raise SystemExit("Downloaded MEGA input appears to be HTML, not a video")
          PY
          input_size="$(stat -c '%s' "${INPUT_VIDEO_PATH}")"
          echo "Downloaded input size: ${input_size} bytes"
          if ! video_stream="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_type -of csv=p=0 "${INPUT_VIDEO_PATH}")"; then
            echo "ffprobe could not recognize the downloaded MEGA input as media."
            exit 1
          fi
          if [[ "${video_stream}" != "video" ]]; then
            echo "ffprobe did not find a video stream in the downloaded MEGA input."
            exit 1
          fi
          cp "${INPUT_VIDEO_PATH}" "${DATASET_DIR}/input.mp4"

      - name: Publish private Kaggle input dataset
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          DATASET_REF="${KAGGLE_USERNAME}/pyvideotrans-input"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "id": f"{os.environ['KAGGLE_USERNAME']}/pyvideotrans-input",
              "title": "pyVideoTrans private workflow input",
              "subtitle": "Ephemeral private input for the hybrid STT workflow",
              "description": "Created and versioned by GitHub Actions; keep this dataset private.",
              "licenses": [{"name": "CC0-1.0"}],
          }
          Path(os.environ["DATASET_DIR"], "dataset-metadata.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          PY
          dataset_probe="$(mktemp)"
          if kaggle datasets files --page-size 1 "${DATASET_REF}" >"${dataset_probe}" 2>&1; then
            rm -f "${dataset_probe}"
            kaggle datasets version --path "${DATASET_DIR}" --message "Update input for ${GITHUB_SHA}" --dir-mode zip --quiet
          else
            if grep -Eiq '(^|[^0-9])403([^0-9]|$)|forbidden|unauthorized|permission' "${dataset_probe}"; then
              echo "Kaggle denied access to existing private dataset ${DATASET_REF}; refusing to create or retry."
              python3 - "${dataset_probe}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          sensitive = re.compile(
              r"(?i)(\b(?:token|password|secret|authorization|api[_-]?key)\b\s*[=:]\s*)"
              r"(?:\"[^\"]*\"|'[^']*'|\S+)"
          )
          print(sensitive.sub(r"\1<redacted>", text).rstrip())
          PY
              rm -f "${dataset_probe}"
              exit 1
            fi
            rm -f "${dataset_probe}"
            kaggle datasets create --path "${DATASET_DIR}" --quiet
          fi
          echo "DATASET_REF=${DATASET_REF}" >> "${GITHUB_ENV}"

      - name: Verify Kaggle dataset accessibility
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MONITOR_TIMEOUT_MINUTES * 60 ))
          while true; do
            files_output="$(mktemp)"
            if kaggle datasets files --csv --page-size 200 "${DATASET_REF}" >"${files_output}" 2>&1; then
              if python3 - "${files_output}" <<'PY'
          import csv
          import sys
          from pathlib import Path

          with Path(sys.argv[1]).open(newline="", encoding="utf-8", errors="replace") as stream:
              rows = csv.DictReader(stream)
              raise SystemExit(0 if any(row.get("name") == "input.mp4" for row in rows) else 1)
          PY
              then
                rm -f "${files_output}"
                echo "Kaggle dataset is accessible and contains input.mp4."
                break
              fi
              rm -f "${files_output}"
            else
              if grep -Eiq '(^|[^0-9])403([^0-9]|$)|(^|[^0-9])401([^0-9]|$)|forbidden|unauthorized|permission' "${files_output}"; then
                echo "Kaggle permanently denied access to ${DATASET_REF}; refusing to retry."
                python3 - "${files_output}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          sensitive = re.compile(
              r"(?i)(\b(?:token|password|secret|authorization|api[_-]?key)\b\s*[=:]\s*)"
              r"(?:\"[^\"]*\"|'[^']*'|\S+)"
          )
          print(sensitive.sub(r"\1<redacted>", text).rstrip())
          PY
                rm -f "${files_output}"
                exit 1
              fi
              rm -f "${files_output}"
            fi
            (( $(date +%s) < deadline )) || { echo "Timed out waiting for Kaggle dataset files"; exit 1; }
            sleep 20
          done

      - name: Prepare deterministic Kaggle kernel package
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          kernel_dir = Path(os.environ["KERNEL_DIR"])
          worker = (root / "kaggle" / "worker.py").read_text(encoding="utf-8")
          worker = worker.replace("__REPOSITORY_URL__", "https://github.com/canibeyours2001-ui/pyvideotrans.git")
          worker = worker.replace("__REPOSITORY_REF__", os.environ["GITHUB_SHA"])
          worker = worker.replace(
              'WHISPER_MODEL = "__WHISPER_MODEL_JSON__"',
              f"WHISPER_MODEL = {json.dumps(os.environ['WHISPER_MODEL'])}",
          )
          (kernel_dir / "worker.py").write_text(worker, encoding="utf-8")

          metadata = json.loads((root / "kaggle" / "kernel-metadata.json").read_text(encoding="utf-8"))
          metadata["id"] = f"{os.environ['KAGGLE_USERNAME']}/pyvideotrans-gpu-worker"
          metadata["dataset_sources"] = [os.environ["DATASET_REF"]]
          (kernel_dir / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          PY

      - name: Launch private Kaggle GPU kernel
        shell: bash
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          KERNEL_REF="${KAGGLE_USERNAME}/pyvideotrans-gpu-worker"
          kaggle kernels push --path "${KERNEL_DIR}" --accelerator "${KAGGLE_ACCELERATOR}"
          echo "KERNEL_REF=${KERNEL_REF}" >> "${GITHUB_ENV}"

      - name: Poll Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + MONITOR_TIMEOUT_MINUTES * 60 ))
          while true; do
            status_output="$(mktemp)"
            kaggle kernels status "${KERNEL_REF}" >"${status_output}" 2>&1 || true
            cat "${status_output}"
            status_text="$(python3 - "${status_output}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").lower()
          matches = re.findall(r"(?:status|state)\s*:\s*([a-z_]+)", text)
          if matches:
              print(matches[-1])
          else:
              for state in ("complete", "running", "queued", "error", "failed", "cancelled", "canceled"):
                  if state in text:
                      print(state)
                      break
              else:
                  print("unknown")
          PY
            )"
            rm -f "${status_output}"
            if [[ "${status_text}" =~ ^(complete|success|finished)$ ]]; then
              break
            fi
            if [[ "${status_text}" =~ ^(error|failed|cancelled|canceled)$ ]]; then
              echo "Kaggle kernel failed. Retrieve its output/logs with: kaggle kernels output ${KERNEL_REF}"
              exit 1
            fi
            (( $(date +%s) < deadline )) || { echo "Timed out waiting for Kaggle kernel"; exit 1; }
            sleep 30
          done

      - name: Download and validate stable Kaggle output
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels output "${KERNEL_REF}" --path "${KAGGLE_OUTPUT_DIR}" --force
          CONTRACT_SRT="${KAGGLE_OUTPUT_DIR}/gpu_output/subtitles.srt"
          [[ -s "${CONTRACT_SRT}" ]] || {
            echo "Missing required Kaggle output: ${CONTRACT_SRT}"
            find "${KAGGLE_OUTPUT_DIR}" -maxdepth 5 -type f -print
            exit 1
          }
          python3 - "${CONTRACT_SRT}" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8-sig", errors="strict").strip()
          if not text or "-->" not in text:
              raise SystemExit("Subtitle validation failed: missing SRT timestamps")
          if not re.search(r"(?m)^\s*\d+\s*$", text):
              raise SystemExit("Subtitle validation failed: missing SRT cue index")
          PY
          cp "${CONTRACT_SRT}" "${FINAL_DIR}/subtitles.srt"

      - name: Render final MP4 with CPU FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y \
            -i "${INPUT_VIDEO_PATH}" \
            -vf "subtitles='${FINAL_DIR}/subtitles.srt':charenc=UTF-8" \
            -c:v libx264 -preset medium -crf 20 -threads 4 \
            -c:a aac -b:a 192k -movflags +faststart \
            "${FINAL_VIDEO_PATH}"
          [[ -s "${FINAL_VIDEO_PATH}" ]] || { echo "Final MP4 is empty"; exit 1; }
          ffprobe -v error -show_format -show_streams "${FINAL_VIDEO_PATH}" >/dev/null

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyvideotrans-final-mp4
          path: |
            ${{ env.FINAL_DIR }}/*.mp4
            ${{ env.FINAL_DIR }}/subtitles.srt
          retention-days: 1

      - name: Upload final video to MEGA
        shell: bash
        run: |
          set -euo pipefail
          collision_listing="${RUNNER_TEMP}/rclone-collision-list.txt"
          if rclone --config "${RCLONE_CONFIG_PATH}" lsf --files-only --format p "megadrive:video-out/${MEGA_OUTPUT_NAME}" >"${collision_listing}" 2>/dev/null; then
            echo "Refusing to overwrite existing MEGA output: ${MEGA_OUTPUT_NAME}"
            rm -f "${collision_listing}"
            exit 1
          else
            status=$?
          fi
          if [[ "${status}" != "3" && "${status}" != "4" ]]; then
            rm -f "${collision_listing}"
            echo "Unable to check existing MEGA output safely (rclone exit ${status})."
            exit "${status}"
          fi
          rm -f "${collision_listing}"
          if ! rclone --config "${RCLONE_CONFIG_PATH}" copyto "${FINAL_VIDEO_PATH}" "megadrive:video-out/${MEGA_OUTPUT_NAME}" --immutable --no-traverse >"${RUNNER_TEMP}/rclone-upload.log" 2>&1; then
            rm -f "${RUNNER_TEMP}/rclone-upload.log"
            echo "Failed to upload ${MEGA_OUTPUT_NAME} to MEGA."
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/rclone-upload.log"

      - name: Verify MEGA output
        shell: bash
        run: |
          set -euo pipefail
          remote_path="megadrive:video-out/${MEGA_OUTPUT_NAME}"
          size_json="${RUNNER_TEMP}/rclone-output-size.json"
          listing="${RUNNER_TEMP}/rclone-output-list.txt"
          if ! rclone --config "${RCLONE_CONFIG_PATH}" size --json "${remote_path}" >"${size_json}" 2>/dev/null; then
            rm -f "${size_json}"
            echo "Unable to verify MEGA output ${MEGA_OUTPUT_NAME}."
            exit 1
          fi
          remote_size="$(python3 - "${size_json}" <<'PY'
          import json
          import sys
          from pathlib import Path

          print(json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["bytes"])
          PY
          )"
          local_size="$(stat -c '%s' "${FINAL_VIDEO_PATH}")"
          if [[ "${remote_size}" != "${local_size}" ]]; then
            rm -f "${size_json}" "${listing}"
            echo "MEGA output size mismatch for ${MEGA_OUTPUT_NAME}: local=${local_size}, remote=${remote_size}."
            exit 1
          fi
          if ! rclone --config "${RCLONE_CONFIG_PATH}" lsf --files-only --format p "${remote_path}" >"${listing}" 2>/dev/null; then
            rm -f "${size_json}" "${listing}"
            echo "Unable to locate MEGA output ${MEGA_OUTPUT_NAME}."
            exit 1
          fi
          remote_count="$(python3 - "${listing}" "${MEGA_OUTPUT_NAME}" <<'PY'
          import sys
          from pathlib import Path

          entries = [line for line in Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if line]
          print(sum(entry == sys.argv[2] for entry in entries))
          PY
          )"
          rm -f "${size_json}" "${listing}"
          if [[ "${remote_count}" != "1" ]]; then
            echo "MEGA output verification found ${remote_count} matching objects for ${MEGA_OUTPUT_NAME}."
            exit 1
          fi
          echo "MEGA output verified: ${MEGA_OUTPUT_NAME} (${remote_size} bytes)"

      - name: Cleanup temporary credentials and media
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rclone_config="${RCLONE_CONFIG_PATH:-${GITHUB_WORKSPACE:-.}/.rclone/pyvideotrans.conf}"
          rm -rf "${GITHUB_WORKSPACE}/.kaggle-staging" "${INPUT_DIR}" "${FINAL_DIR}"
          rm -f "${rclone_config}" "${rclone_config}.tmp" \
            "${RUNNER_TEMP}/rclone-auth.log" "${RUNNER_TEMP}/rclone-download.log" \
            "${RUNNER_TEMP}/rclone-upload.log" "${RUNNER_TEMP}/rclone-output-size.json" \
