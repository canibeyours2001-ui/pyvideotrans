name: Deploy VideoTrans Studio
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: videotrans-studio-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      STUDIO_TOKEN: ${{ secrets.STUDIO_TOKEN }}
      OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
      OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
      OMNIROUTE_MODEL: ${{ secrets.OMNIROUTE_MODEL }}
      FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
      FREELLMAPI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      FREELLMAPI_MODEL: ${{ secrets.FREELLMAPI_MODEL }}
      MVSEP_API_KEY: ${{ secrets.MVSEP_API_KEY }}
      MVSEP_SEP_TYPE: ${{ secrets.MVSEP_SEP_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment dependencies
        run: python -m pip install 'modal==1.5.5'
      - name: Validate and synchronize service secrets
        run: python backend/configure_modal.py
      - name: Deploy authenticated processing service
        run: modal deploy backend/modal_app.py
      - name: Next step
        run: |
          echo 'Copy the HTTPS endpoint printed above into the website Connections tab.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use the same STUDIO_TOKEN. GPU processing starts only when you submit a project.' >> "$GITHUB_STEP_SUMMARY"
