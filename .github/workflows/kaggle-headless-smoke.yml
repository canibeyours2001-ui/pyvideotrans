name: Kaggle headless VoxCPM2 smoke

on:
  push:
    branches: [pyvideotrans]
    paths:
      - "videotrans/voxcpm2/**"
      - "videotrans/configure/**"
      - "videotrans/task/simple_runnable_qt.py"
      - ".github/workflows/kaggle-headless-smoke.yml"
  workflow_dispatch:

jobs:
  headless-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal headless test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir numpy soundfile certifi tenacity==9.1.2 tqdm urllib3 requests aiohttp httpx gradio==6.8.0

      - name: Verify PySide6 is NOT installed
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("PySide6") is None, "PySide6 unexpectedly installed"
          print("PySide6 absent as intended")
          PY

      - name: Import VoxCPM2 integration headlessly
        env:
          PYVIDEOTRANS_LANG: en_US
          HF_HOME: /tmp/hf
          HF_HUB_CACHE: /tmp/hf/hub
        run: |
          python - <<'PY'
          from videotrans.configure.signal_hub import SignalHub
          hub = SignalHub.instance()
          seen = []
          hub.new_message.connect(lambda u, d: seen.append((u, d)))
          hub.post("smoke", {"ok": True})
          assert seen and seen[0][0] == "smoke"

          from videotrans.voxcpm2.engine import (
              DualGPUVoxCPM,
              make_generation_kwargs,
              split_long_text,
          )
          assert split_long_text("hello world", 80) == ["hello world"]
          print("Headless imports passed")
          PY

      - name: Exercise two-worker scheduler without a GPU/model download
        env:
          PYVIDEOTRANS_LANG: en_US
          VOXCPM2_TEST_FAKE_WORKER: "1"
          HF_HOME: /tmp/hf
          HF_HUB_CACHE: /tmp/hf/hub
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cat > /tmp/test_voxcpm2_scheduler.py <<'PY'
          from pathlib import Path
          import tempfile

          from videotrans.voxcpm2.engine import DualGPUVoxCPM, make_generation_kwargs

          def main():
              root = Path(tempfile.mkdtemp(prefix="vox-smoke-"))
              tasks = []
              for i in range(8):
                  tasks.append({
                      "chunk_index": i,
                      "output_path": str(root / f"{i:02d}.wav"),
                      "kwargs": make_generation_kwargs(f"chunk {i}"),
                  })

              with DualGPUVoxCPM(
                  model_dir="fake-model",
                  gpu_ids=(0, 1),
                  startup_timeout=30,
                  status_callback=print,
              ) as service:
                  results = list(service.iter_results(tasks))

              assert [r["chunk_index"] for r in results] == list(range(8))
              assert all(Path(r["output_path"]).is_file() for r in results)
              used = {r["gpu"] for r in results}
              assert used == {0, 1}, f"expected both workers, got {used}"
              print("Two-worker scheduler passed:", sorted(used))

          if __name__ == "__main__":
              main()
          PY
          python /tmp/test_voxcpm2_scheduler.py

      - name: Import WebUI headlessly without PySide6
        env:
          PYVIDEOTRANS_LANG: en_US
          HF_HOME: /tmp/hf
          HF_HUB_CACHE: /tmp/hf/hub
        run: |
          python - <<'PY'
          import webui
          from videotrans import tts
          assert tts.VOXCPM2_BUILTIN_TTS in webui.SELECTABLE_TTS
          assert "VoxCPM2" in tts.TTS_NAME_LIST[tts.VOXCPM2_BUILTIN_TTS]
          app = webui.build_ui()
          assert app is not None
          print("Headless webui import + Gradio UI build passed")
          PY

      - name: Kaggle launcher self-test
        env:
          PYVIDEOTRANS_LANG: en_US
          HF_HOME: /tmp/hf
          HF_HUB_CACHE: /tmp/hf/hub
        run: |
          python kaggle_launcher.py --self-test

      - name: Compile Gradio integration modules
        run: |
          python -m py_compile             webui.py             videotrans/voxcpm2/engine.py             videotrans/voxcpm2/library.py             videotrans/voxcpm2/gradio_tools.py             videotrans/voxcpm2/gradio_ui.py             videotrans/process/voxcpm2_tts.py             videotrans/tts/_voxcpm2builtin.py             videotrans/configure/signal_hub.py             videotrans/configure/_i18n.py             videotrans/task/simple_runnable_qt.py
