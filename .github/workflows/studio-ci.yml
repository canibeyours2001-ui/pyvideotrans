name: VideoTrans Studio checks
on:
  pull_request:
    paths: ['studio/**', '.github/workflows/studio-*.yml']
  push:
    paths: ['studio/**', '.github/workflows/studio-*.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m pip install fastapi==0.115.12 httpx==0.28.1 pydantic==2.11.4 pytest
      - run: python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run install:ci
      - run: npx tsc --noEmit
      - run: npm run build
